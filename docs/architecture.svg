<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1010" font-family="Segoe UI, system-ui, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b1220"/><stop offset="0.55" stop-color="#101b33"/><stop offset="1" stop-color="#0b1f2a"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  <style>
    .panel { fill:#141d3a; fill-opacity:.93; stroke:#26324f; stroke-width:2; }
    .ptitle { fill:#93a4c8; font-size:16px; font-weight:700; letter-spacing:1.5px; }
    .node text.t1 { font-size:16px; font-weight:700; }
    .node text.t2 { font-size:12px; fill:#c9d6ee; }
    .flow { fill:none; stroke-width:4.5; stroke-linecap:round; stroke-dasharray:2 14;
             animation: dash 1.6s linear infinite; }
    .wire { fill:none; stroke:#2c3d63; stroke-width:2.5; }
    @keyframes dash { to { stroke-dashoffset:-96; } }
    .glowpulse { animation: glow 3.4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { opacity:.22; } 50% { opacity:.55; } }
    .title { fill:#e7eefc; font-size:29px; font-weight:800; }
  </style>
</defs>
<rect width="1680" height="1010" fill="url(#bg)"/>
