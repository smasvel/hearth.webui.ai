# Drop-in for the local Qwen3-0.6B CPU service, installed as
# ~/.config/systemd/user/vllm.service.d/tools.conf.
# Hermes matches Qwen3's JSON <tool_call> template; qwen3_xml is for Coder XML.
[Service]
ExecStart=
ExecStart=/bin/bash -c 'exec %h/.local/share/hearth/vllm/.venv/bin/vllm serve "$VLLM_MODEL" --host 127.0.0.1 --port 8000 --max-model-len "$VLLM_MAX_MODEL_LEN" --dtype "$VLLM_DTYPE" --enable-auto-tool-choice --tool-call-parser hermes --reasoning-parser qwen3'
