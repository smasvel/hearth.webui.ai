name: Attach OS install packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Build platform install bundles
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_TAG"
          mkdir -p release-packages
          git archive --format=tar.gz --prefix="Hearth-${version}/" \
            --output "release-packages/Hearth-${version}-linux.tar.gz" HEAD
          git archive --format=tar.gz --prefix="Hearth-${version}/" \
            --output "release-packages/Hearth-${version}-macos.tar.gz" HEAD
          git archive --format=zip --prefix="Hearth-${version}/" \
            --output "release-packages/Hearth-${version}-windows-x64.zip" HEAD

      - name: Attach packages to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-packages/* --clobber
