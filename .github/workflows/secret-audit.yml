name: Check repository secrets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check reachable history and checkout
        run: python3 tools/check_push_secrets.py --all-history --working-tree
