<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>{{ 'Create administrator' if setup_mode else 'Sign in' }} — Hearth</title>
  <link rel="stylesheet" href="{{ asset('style.css') }}" />
</head>
<body class="login-body">
  <div class="login-card">
    <h1>{{ 'Set up Hearth' if setup_mode else 'Hearth' }}</h1>
    {% if setup_mode %}<p>Create the first administrator account to finish setup.</p>{% endif %}
    {% if error %}<p class="login-error">{{ error }}</p>{% endif %}
    <form method="post" class="login-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <label>Username
        <input type="text" name="username" value="{{ 'admin' if setup_mode else '' }}" autocomplete="username" autofocus required />
      </label>
      {% if setup_mode %}
        <label>Admin password
          <input type="password" name="password" autocomplete="new-password" minlength="8" required />
        </label>
        <label>Confirm admin password
          <input type="password" name="password_confirm" autocomplete="new-password" minlength="8" required />
        </label>
        <button type="submit">Create administrator</button>
      {% else %}
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button type="submit">Sign in</button>
      {% endif %}
    </form>
  </div>
</body>
</html>
